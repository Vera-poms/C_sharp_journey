# Development mode: source is bind-mounted, so edits show up on browser refresh
# with no rebuild or recreate.
#   web-dev: Vite dev server with hot reload (instead of the nginx image)
#   api:     uvicorn --reload
#
#   podman-compose -f compose.yaml -f compose.dev.yaml up -d db runner api web-dev
#
# The production-style build is unchanged: podman-compose up --build
services:
  web-dev:
    image: docker.io/library/node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --port 5173"
    environment:
      API_URL: http://api:8000
      VITE_POLL: "1"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:8080:5173"
    networks: [public]
    depends_on:
      - api

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/app
    volumes:
      - ./backend/app:/srv/app:ro

volumes:
  web_node_modules:
