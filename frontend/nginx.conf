# Code-execution endpoints are expensive (each one compiles C#), so throttle them per client IP.
limit_req_zone $binary_remote_addr zone=run:10m rate=20r/m;
limit_req_status 429;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 128k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location ~ ^/api/lessons/\d+/(codealong/run|scratch/run|lab/run|lab/submit)$ {
    limit_req zone=run burst=10 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 100s;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
